<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Endless Void</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="void-canvas"></canvas>
    <main class="container">
        <h1 class="title animated-text" id="typewriter">WELCOME TO THE ENDLESS VOID</h1>
        <p class="subtitle">Step into the unknown. Track your journey into infinity.</p>
        <div class="stats-panel">
            <p>Visits: <span id="visit-count">0</span></p>
            <p>Time Elapsed: <span id="time-elapsed">0</span>s</p>
        </div>
        <button id="enter-btn" class="cta-btn">Enter the Void</button>
    </main>
    <script src="script.js"></script>
</body>
</html>
